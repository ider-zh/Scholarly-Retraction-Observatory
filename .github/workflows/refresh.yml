name: Refresh aggregate research statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: retraction-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify analytical rules
        run: python -m unittest discover -s tests
      - name: Build aggregate statistics offline
        run: python pipeline/build.py --download
      - name: Build frontend and enforce public data boundary
        run: npm run build
      - name: Propose statistics update only
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/weekly-refresh
          commit-message: Refresh aggregate statistics and bounded display samples
          title: Refresh retraction research statistics
          body: Only precomputed statistics and up to 36 illustrative samples are published. Review the cohort, quality counts, matching coverage and generated observations before merging. No raw records or compressed corpus are included.
          add-paths: public/data/
